name: Deploy DevOps Agent Platform

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'bin/**'
      - 'lambda/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de destino'
        required: true
        default: 'prod'
        type: choice
        options: [prod, nonprod]

# Necessario para autenticacao via OIDC (nenhuma chave de acesso estatica)
permissions:
  id-token: write
  contents: read

jobs:
  diff:
    name: CDK Diff
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'prod' }}
    outputs:
      environment: ${{ github.event.inputs.environment || 'prod' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Configurar credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-skip-session-tagging: true

      - name: Verificar sintaxe TypeScript
        run: npx tsc --noEmit

      - name: CDK Diff
        run: npx cdk diff -c env=${{ github.event.inputs.environment || 'prod' }}

  deploy:
    name: CDK Deploy
    needs: diff
    runs-on: ubuntu-latest
    environment: ${{ needs.diff.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Configurar credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: CDK Deploy
        run: npx cdk deploy --require-approval never -c env=${{ needs.diff.outputs.environment }} --all
